# Deploys the API to ECS Fargate (ap-south-1). Runs after CI passes on main, or by hand.
# One-time setup is in DEPLOYMENT.md. Until the repository variables below are set,
# this workflow skips itself instead of failing.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN   IAM role GitHub assumes via OIDC (no long-lived AWS keys)
#   AWS_ACCOUNT_ID        12-digit account id
#   ECS_SUBNETS           comma-separated public subnet ids, for the migration task
#   ECS_SECURITY_GROUP    security group id of the API tasks
#   APP_URL               the web app's URL, e.g. https://app.yourdomain.com (becomes CORS_ORIGINS)
name: Deploy API
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bitebox-api
  ECS_CLUSTER: bitebox
  ECS_SERVICE: bitebox-api

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm # native ARM runner: builds the Graviton image without emulation
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Render task definition
        id: taskdef
        run: |
          sed -e "s/<ACCOUNT_ID>/${{ vars.AWS_ACCOUNT_ID }}/g" \
              -e "s#https://app.<YOUR_DOMAIN>#${{ vars.APP_URL }}#g" \
              deploy/ecs-task-definition.json > taskdef.json

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: render
        with:
          task-definition: taskdef.json
          container-name: api
          image: ${{ steps.image.outputs.image }}

      - name: Register task definition
        id: register
        run: |
          ARN=$(aws ecs register-task-definition --cli-input-json file://${{ steps.render.outputs.task-definition }} \
                --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # Migrations run once, as a one-off task with the new image, before any new container serves traffic.
      - name: Run database migrations
        run: |
          TASK=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "${{ steps.register.outputs.arn }}" \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP }}],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/database/migrate.js"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK"
          CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $CODE"
          test "$CODE" = "0"

      # Rolling deploy: ECS starts new tasks, waits for the load balancer health check, then drains old ones.
      - name: Deploy service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
