# The low-cost option: everything on one Lightsail instance (see DEPLOYMENT.md, "Option A").
# Caddy gets HTTPS certificates automatically and serves the web app's static files.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro # copy bitebox-web/dist here
      - caddy_data:/data
    depends_on: [api]

  api:
    build: ../..
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://bitebox:${POSTGRES_PASSWORD}@postgres:5432/bitebox
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "true" # single instance, so running migrations on start is safe here
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bitebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bitebox
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitebox"]
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
