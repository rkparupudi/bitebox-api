services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bitebox
      POSTGRES_PASSWORD: bitebox
      POSTGRES_DB: bitebox
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitebox"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    environment:
      DATABASE_URL: postgres://bitebox:bitebox@postgres:5432/bitebox
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]

volumes:
  pgdata:
